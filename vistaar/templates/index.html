<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vistaar — cited answers from your documents</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --edge: #262b36; --text: #e6e8ec;
      --muted: #98a0ae; --accent: #5b8cff; --ok: #35c07f; --warn: #e0a341;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 20px; background: var(--bg); color: var(--text);
           font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width: 780px; margin: 0 auto; }
    h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.3px; }
    .sub { color: var(--muted); margin: 0 0 32px; font-size: 14px; }
    .card { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px;
            padding: 22px; margin-bottom: 18px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px;
         color: var(--muted); margin: 0 0 14px; font-weight: 600; }
    input[type=file] { width: 100%; padding: 10px; background: #0d0f13;
                       border: 1px dashed var(--edge); border-radius: 8px; color: var(--muted); }
    textarea { width: 100%; padding: 12px; background: #0d0f13; border: 1px solid var(--edge);
               border-radius: 8px; color: var(--text); resize: vertical; font: inherit; }
    textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button { margin-top: 12px; padding: 10px 20px; border: 0; border-radius: 8px;
             background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; font-size: 14px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status { margin-top: 12px; font-size: 13px; }
    .status.ok { color: var(--ok); } .status.err { color: #ff6b6b; }
    .answer { margin-top: 16px; padding: 16px; background: #0d0f13; border-radius: 8px;
              border-left: 3px solid var(--accent); white-space: pre-wrap; display: none; }
    .meta { margin-top: 10px; font-size: 12px; color: var(--muted); display: none; }
    .cite { margin-top: 8px; padding: 10px 12px; background: #12151b; border: 1px solid var(--edge);
            border-radius: 6px; font-size: 13px; color: var(--muted); }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px;
            font-weight: 600; margin-right: 6px; }
    .pill.abstain { background: rgba(224,163,65,.15); color: var(--warn); }
    .pill.answered { background: rgba(53,192,127,.15); color: var(--ok); }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Vistaar</h1>
  <p class="sub">Upload a document, ask a question, get an answer with the exact passages that support it.</p>

  <div class="card">
    <h2>1 · Document</h2>
    <input type="file" id="file" accept=".pdf,.txt,.md">
    <button id="uploadBtn">Upload &amp; index</button>
    <div class="status" id="uploadStatus"></div>
  </div>

  <div class="card">
    <h2>2 · Question</h2>
    <textarea id="question" rows="3" placeholder="What does this document say about..."></textarea>
    <button id="askBtn">Ask</button>
    <div class="answer" id="answer"></div>
    <div class="meta" id="meta"></div>
    <div id="citations"></div>
  </div>
</div>

<script>
const ns = "session-" + Math.random().toString(36).slice(2, 10);
const $ = id => document.getElementById(id);

function setStatus(el, text, kind) {
  el.textContent = text;
  el.className = "status" + (kind ? " " + kind : "");
}

$("uploadBtn").onclick = async () => {
  const file = $("file").files[0];
  if (!file) return setStatus($("uploadStatus"), "Choose a file first.", "err");
  const body = new FormData();
  body.append("file", file);
  body.append("namespace", ns);
  $("uploadBtn").disabled = true;
  setStatus($("uploadStatus"), "Indexing…");
  try {
    const res = await fetch("/upload", { method: "POST", body });
    const data = await res.json();
    if (!res.ok) return setStatus($("uploadStatus"), data.detail || "Upload failed.", "err");
    setStatus($("uploadStatus"), `Indexed ${data.chunks} chunks from ${data.pages} page(s).`, "ok");
  } catch (e) {
    setStatus($("uploadStatus"), "Network error.", "err");
  } finally {
    $("uploadBtn").disabled = false;
  }
};

$("askBtn").onclick = async () => {
  const question = $("question").value.trim();
  if (!question) return;
  $("askBtn").disabled = true;
  $("answer").style.display = "block";
  $("answer").textContent = "Retrieving and reading…";
  $("citations").innerHTML = "";
  $("meta").style.display = "none";
  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, namespace: ns })
    });
    const data = await res.json();
    if (!res.ok) {
      $("answer").textContent = data.detail || "Request failed.";
      return;
    }
    const badge = data.abstained
      ? '<span class="pill abstain">abstained</span>'
      : '<span class="pill answered">answered</span>';
    $("answer").innerHTML = badge + "";
    $("answer").appendChild(document.createTextNode(data.answer));

    const conf = (data.scores && data.scores.confidence) || 0;
    $("meta").textContent =
      `confidence ${conf.toFixed(3)} · ${(data.latency_s).toFixed(2)}s · ` +
      `${data.citations.length} citation(s)`;
    $("meta").style.display = "block";

    if (data.citations.length) {
      $("citations").innerHTML = data.citations.map(c =>
        `<div class="cite"><strong>[${c.id}] page ${c.page}</strong> — ${
          c.text.slice(0, 260).replace(/&/g,"&amp;").replace(/</g,"&lt;")
        }…</div>`).join("");
    }
  } catch (e) {
    $("answer").textContent = "Network error.";
  } finally {
    $("askBtn").disabled = false;
  }
};
</script>
</body>
</html>
